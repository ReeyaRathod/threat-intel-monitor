<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SOC Portal - Analyst Login</title>
    <style>
        body { background-color: #080a0f; color: #c9d1d9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: #161b22; padding: 40px; border-radius: 8px; border: 1px solid #30363d; width: 320px; box-shadow: 0 8px 24px rgba(0,0,0,0.8); }
        h2 { color: #58a6ff; margin-top: 0; text-align: center; font-size: 20px; }
        label { display: block; margin-bottom: 8px; font-size: 13px; color: #8b949e; }
        input { width: 100%; padding: 10px; margin-bottom: 20px; background: #0d1117; border: 1px solid #30363d; border-radius: 6px; color: #fff; box-sizing: border-box; }
        button { width: 100%; background: #238636; color: white; padding: 10px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        button:hover { background: #2ea043; }
        .error { color: #f85149; font-size: 12px; text-align: center; margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>🛡️ SOC ANALYST LOGIN</h2>
        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}
        <form method="POST">
            <label>Username</label>
            <input type="text" name="username" required placeholder="analyst">
            <label>Password</label>
            <input type="password" name="password" required placeholder="••••••••">
            <button type="submit">Authenticate</button>
        </form>
    </div>
</body>
</html>
